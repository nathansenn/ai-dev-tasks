name: Temporary Meshy artifact builder

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temporary-meshy-artifact-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.head_ref == 'agent/temporary-meshy-build'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out temporary generator
        uses: actions/checkout@v4
        with:
          ref: agent/temporary-meshy-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Receive credential securely and recover completed assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .secure
          chmod 700 .secure
          PUBLIC_COMMENT_ID=''
          CIPHER_COMMENT_ID=''

          cleanup() {
            unset MESHY_API_KEY || true
            for file in .secure/key.txt .secure/key.bin .secure/private.pem; do
              if [[ -f "$file" ]]; then shred -u "$file" 2>/dev/null || rm -f "$file"; fi
            done
            rm -f .secure/public.pem
            if [[ -n "$CIPHER_COMMENT_ID" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${CIPHER_COMMENT_ID}" >/dev/null 2>&1 || true
            fi
            if [[ -n "$PUBLIC_COMMENT_ID" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${PUBLIC_COMMENT_ID}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out .secure/private.pem >/dev/null 2>&1
          openssl pkey -in .secure/private.pem -pubout -out .secure/public.pem >/dev/null 2>&1
          PUBLIC_KEY_B64="$(base64 -w0 .secure/public.pem)"
          PUBLIC_BODY="MESHY_HANDSHAKE_READY
          run_id=${GITHUB_RUN_ID}
          algorithm=RSA-OAEP-SHA256
          public_key=${PUBLIC_KEY_B64}"
          PUBLIC_RESPONSE="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$PUBLIC_BODY")"
          PUBLIC_COMMENT_ID="$(printf '%s' "$PUBLIC_RESPONSE" | jq -r '.id')"
          echo "Published one-time public key for run ${GITHUB_RUN_ID}."

          FOUND=''
          for _ in $(seq 1 180); do
            COMMENTS="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
            FOUND="$(printf '%s' "$COMMENTS" | jq -r --arg run "$GITHUB_RUN_ID" '
              map(select((.body | contains("MESHY_HANDSHAKE_CIPHERTEXT")) and (.body | contains("run_id=" + $run))))
              | last
              | if . == null then "" else
                  (.body | capture("ciphertext=(?<cipher>[A-Za-z0-9+/=]+)")) as $m
                  | "\(.id)|\($m.cipher)"
                end
            ')"
            if [[ -n "$FOUND" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$FOUND" ]]; then
            echo 'Timed out waiting for encrypted Meshy credential.' >&2
            exit 1
          fi

          CIPHER_COMMENT_ID="${FOUND%%|*}"
          CIPHER_B64="${FOUND#*|}"
          printf '%s' "$CIPHER_B64" | base64 -d > .secure/key.bin
          openssl pkeyutl -decrypt \
            -inkey .secure/private.pem \
            -in .secure/key.bin \
            -out .secure/key.txt \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256

          MESHY_API_KEY="$(tr -d '\r\n' < .secure/key.txt)"
          if [[ "$MESHY_API_KEY" != msy_* ]]; then
            echo 'Encrypted handoff did not contain a valid Meshy API key.' >&2
            exit 1
          fi
          echo "::add-mask::$MESHY_API_KEY"
          export MESHY_API_KEY

          python -m pip install --disable-pip-version-check --quiet requests
          python temporary-meshy-build/recover.py

      - name: Optimize GLBs for browser delivery
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @gltf-transform/cli@4.4.2
          mkdir -p build-output/raw
          for RAW in build-output/*.raw.glb; do
            BASE="$(basename "$RAW" .raw.glb)"
            WEB="build-output/${BASE}.web.glb"
            cp "$RAW" "build-output/raw/$(basename "$RAW")"
            if gltf-transform optimize "$RAW" "$WEB" \
              --compress meshopt \
              --texture-compress webp \
              --texture-size 2048; then
              echo "Optimized $(basename "$RAW") -> $(basename "$WEB")"
            else
              echo "Optimizer failed; preserving original GLB as web asset"
              cp "$RAW" "$WEB"
            fi
            rm -f "$RAW"
            gltf-transform inspect "$WEB" > "${WEB%.glb}.inspect.txt" || true
          done

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('build-output/meshy-generation.json')
          data = json.loads(path.read_text())
          for asset in data['assets']:
              web_name = asset['filename'].replace('.raw.glb', '.web.glb')
              web = Path('build-output') / web_name
              asset['web_file'] = web_name
              asset['web_bytes'] = web.stat().st_size
              asset['web_sha256'] = hashlib.sha256(web.read_bytes()).hexdigest()
              asset['web_pipeline'] = 'glTF Transform 4.4.2 optimize + Meshopt + WebP 2K'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Validate artifact contents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('build-output')
          manifest = json.loads((root / 'meshy-generation.json').read_text())
          expected = {
              'gear-ratio-workshop-meshy.web.glb',
              'gear-ratio-millstone-meshy.web.glb',
          }
          actual = {path.name for path in root.glob('*.web.glb')}
          if actual != expected:
              raise SystemExit(f'Unexpected web GLBs: {actual}')
          if len(manifest.get('assets', [])) != 2:
              raise SystemExit('Manifest does not describe two assets')
          for path in root.glob('*.web.glb'):
              if path.stat().st_size < 100_000 or path.read_bytes()[:4] != b'glTF':
                  raise SystemExit(f'Invalid GLB: {path}')
              print(f'{path.name}: {path.stat().st_size:,} bytes')
          if any(b'msy_' in path.read_bytes() for path in root.rglob('*') if path.is_file() and path.suffix not in {'.glb', '.png'}):
              raise SystemExit('Credential-like text found in build output')
          PY

      - name: Upload transferable artifact
        uses: actions/upload-artifact@v4
        with:
          name: commander-gear-ratio-meshy-${{ github.run_id }}
          path: build-output
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Publish immutable public asset commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/commander-assets/gear-ratio"
          cp build-output/*.web.glb "$STAGE/commander-assets/gear-ratio/"
          cp build-output/*-preview.png "$STAGE/commander-assets/gear-ratio/" 2>/dev/null || true
          cp build-output/*.inspect.txt "$STAGE/commander-assets/gear-ratio/" 2>/dev/null || true
          cp build-output/meshy-generation.json "$STAGE/commander-assets/gear-ratio/"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan commander-gear-ratio-assets
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$STAGE/." .
          git add commander-assets/gear-ratio
          git commit -m 'Publish Commander gear-ratio Meshy assets'
          git push --force origin HEAD:commander-gear-ratio-assets
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Published immutable asset commit $SHA"

      - name: Report completion
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_SHA: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          gh issue comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "MESHY_ARTIFACT_READY
          run_id=${GITHUB_RUN_ID}
          artifact=commander-gear-ratio-meshy-${GITHUB_RUN_ID}
          asset_commit=${ASSET_SHA}
          assets=gear-ratio-workshop-meshy.web.glb,gear-ratio-millstone-meshy.web.glb"

      - name: Report sanitized failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "MESHY_ARTIFACT_BUILD_FAILED
          run_id=${GITHUB_RUN_ID}
          The recovery workflow failed with sanitized logs; no plaintext API key was committed."
